[package]
name = "lmu-race-engineering"
description = "LMU Race Engineering desktop application (driver and engineer modes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "lmu-race-engineering"

# Tauri 2 lib + bin pattern: all application code lives in the library (`run()`), `main.rs` only calls it.
# The `_lib` suffix avoids a Windows name clash between the bin's and the lib's build artefacts (PDB).
# Desktop-only product: `rlib` is sufficient (the mobile template's staticlib/cdylib are not built).
[lib]
name = "lmu_race_engineering_lib"
crate-type = ["rlib"]

[[bin]]
name = "lmu-race-engineering"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Stay on the Tauri 2.12 line to match @tauri-apps/api / @tauri-apps/cli ~2.12 (major.minor must agree).
tauri = { version = "~2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
